name: auto-sync

# 让"上游又发新版了"从一件人盯的事，变成一条每天自己跑、并且**说实话**的流水线。
#
# 为什么要它：目标是"客户端跟着最上游自动更新、自动构建、自动发布 Release"。但"自动合并"能不能开，
# 不是拍脑袋决定的。第一次量（2026-10-10，上游 v0.2.3 那一刀，基线 = 共同祖先 v0.2.2）：上游动了 **203 个文件 / 36 个提交**，
# 其中 **17 个落在我们记录的 36 个挂载点文件上**；严格合并（不替人解决冲突）在 **2 个文件**上冲突（`data/assets.json`、
# `public/css/screens/loadout.css`）。这两个数是不同的东西：冲突是要人点的文件，17 是"上游改了我们会挂进去的文件"，
# 那里合并会安静地成功、而我们的上下文可能已经变了 —— 所以这条 lane 除了数冲突，还直接把
# `patches/game-client.patch` 在合并结果上试打一遍（tools/check-patch-applies.mjs）。
# 那一刀已经合进 feat/skins（2cb8387e），所以这条 lane 现在报的是"落后 0"——它的价值在于下一次自动给这个答案。
#
# 所以这条 lane 的角色是**量**，不是替你决定：
#   report 模式（默认，也是 schedule 跑的模式）：什么都不推，只算"这一刀合过来要冲突几个文件、其中几个压着我们的挂载点、
#           补丁还打不打得上"。它每天给一次答案，趋势好坏看得见。
#   branch 模式：零冲突**且**补丁打得上时，把合并结果推到 `auto/upstream-sync-<tag>`（绝不碰 feat/skins —— 那条分支
#           可能正被人/别的会话用），给后面的 test-game-branch 与 cut-payload 当输入。
#   有冲突或补丁打不上时 branch 模式也不硬合：把清单列出来，然后停下。合并是人的决定，"自动化"不该把这个决定偷走。
#
# 真正的自动化路线（写进 docs/AUTO-UPDATE.md §5/§6）：冲突降到 0 + 注入面收缩（task #42）之后，
# 才把 schedule 从"只量"升到"合干净就出包、出包就发 Release"。顺序反了就是自动发坏包。

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'report=只量不推（默认）/ branch=干净时推 auto/ 分支 / auto=干净且套件绿时自动合进服务端上线分支'
        required: false
        default: 'report'
        type: choice
        options:
          - 'report'
          - 'branch'
          - 'auto'
      game_repo:
        description: '我们的 fork(owner/name)'
        required: false
        default: 'lilyco-42/Stronghold-Protocol'
      upstream_repo:
        description: '最上游(owner/name)'
        required: false
        default: 'sganggs/Stronghold-Protocol'
      base_ref:
        description: '从哪条分支出发做合并（只读，不会推回它）'
        required: false
        default: 'feat/skins'
      live_ref:
        description: 'auto 模式合进哪条分支（服务端的 deploy hook / timer 拉的就是它）'
        required: false
        default: 'deploy/prod'
      payload_release:
        description: '跑游戏套件要用的 payload Release（留空=自动取最新的 payload-* tag）'
        required: false
        default: ''
  schedule:
    - cron: '37 18 * * *'   # 每天一次（UTC 18:37 ≈ 北京 02:37），错开整点

# schedule 跑的时候 inputs 全是空字符串，直接用 inputs.repository 会让 checkout 拿到空值、
# 每晚红一次却没人看。所有引用都走下面这份带默认值的 env。
env:
  NODE_VERSION: '22'
  GAME_REPO: ${{ inputs.game_repo || 'lilyco-42/Stronghold-Protocol' }}
  UPSTREAM_REPO: ${{ inputs.upstream_repo || 'sganggs/Stronghold-Protocol' }}
  BASE_REF: ${{ inputs.base_ref || 'feat/skins' }}
  MODE: ${{ inputs.action || 'report' }}
  LIVE_REF: ${{ inputs.live_ref || 'deploy/prod' }}
  PAYLOAD_RELEASE: ${{ inputs.payload_release || '' }}
  # auto 模式的**最后一道**开关：置 off 时整套动作照跑（合并、装依赖、跑套件），但一次性也不推。
  # 出错/出坏包时的止损是一个仓库变量，不用改 YAML —— 这条比"改代码再回滚"快一个数量级。
  AUTO_SYNC_LIVE: ${{ vars.AUTO_SYNC_LIVE || 'off' }}

permissions:
  contents: write   # auto 模式才会写（合进 LIVE_REF），report（schedule）一个对象都不写
  issues: write     # 需要人处理的那些刀落成 issue，而不是安静红色

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # auto 模式要多一步：拉 1 GB 素材 + 跑完整游戏套件（report 模式通常 1 分钟内完事）
    steps:
      - name: checkout 我们的 fork（带全历史与 tag，合并要算 merge base）
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GAME_REPO }}
          ref: ${{ env.BASE_REF }}
          path: game
          fetch-depth: 0
          fetch-tags: true

      # 补丁（patches/game-client.patch）和它的工具都住在客户端仓，不在这条 lane 的默认 checkout 里；
      # 要在这跑"上游这一刀之后补丁还打得上吗"，就得把它取下来。客户端仓小，浅克隆即可。
      - name: checkout 客户端仓（补丁与打包工具）
        uses: actions/checkout@v4
        with:
          path: client
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 取最上游，找出最新的 release tag
        id: up
        working-directory: game
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null || true
          git fetch -q --tags upstream
          TIP=$(git rev-parse upstream/master)
          # "最新 tag"取 upstream/master 上可达的最大版本 tag，而不是仓库里随便一个老 tag。
          NEWEST=$(git describe --tags --abbrev=0 "$TIP" 2>/dev/null || echo '')
          if [ -z "$NEWEST" ]; then
            # 上游没打 tag 就只能拿 tip 当那一刀；这时候 up_to_date 用 tip 判，别让空字符串把 set -e 炸掉。
            NEWEST="$TIP"
            echo "（上游 master 上没有可达的 tag，改用 tip 当同步目标）"
          fi
          echo "tip=$TIP"
          echo "newest=$NEWEST"
          echo "tip=$TIP" >> "$GITHUB_OUTPUT"
          echo "newest=$NEWEST" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$NEWEST" HEAD 2>/dev/null; then
            echo "up_to_date=yes" >> "$GITHUB_OUTPUT"
          else
            echo "up_to_date=no" >> "$GITHUB_OUTPUT"
          fi
          echo "落后 $(git rev-list --count HEAD..$TIP) 个提交 / 领先 $(git rev-list --count $TIP..HEAD) 个我们自己的提交"
          git log --oneline -1 "$NEWEST" | sed 's/^/上游那一刀: /'
          # 后面"上游动了哪些文件"必须以此为基线。用 HEAD 当基线是错的：HEAD 里含我们自己那 586 行挂载改动（记在 36 个上游文件上），
          # `git diff HEAD..upstream/master` 会把我们的差异一起算进去 —— 实测那样会报"37/37 全压着挂载点"，
          # 而按 merge base 算是 203 个文件里 18 个。数字错了，结论就会跟着错。
          BASE=$(git merge-base HEAD "$TIP")
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "共同祖先 $BASE（$(git log --oneline -1 "$BASE" | cut -d' ' -f2- | cut -c1-60)）"

      - name: 已经同步过就直接收工
        if: steps.up.outputs.up_to_date == 'yes'
        run: echo "✅ ${{ env.BASE_REF }} 已包含上游 ${{ steps.up.outputs.newest }} —— 这一跑无事可做，也没推任何东西。"

      - name: 量这一刀的代价（严格合并 + 补丁可否打上），量完把树还原
        if: steps.up.outputs.up_to_date == 'no'
        id: try
        working-directory: game
        env:
          NEW: ${{ steps.up.outputs.newest }}
          GAME: ${{ github.workspace }}/game
          CLIENT: ${{ github.workspace }}/client
          PATCH_OUT: ${{ runner.temp }}/patch-check
          CONFLICTS_FILE: ${{ runner.temp }}/conflicts.txt
        run: |
          set -euo pipefail
          git config user.name 'auto-sync (gate)'; git config user.email 'auto-sync@invalid'
          BASE=$(git rev-parse HEAD)
          : > "$CONFLICTS_FILE"
          # 必须用**严格**的 --no-commit 合并来量代价。这里不能用 `-X theirs`/`-X ours`：那种合并会替人把冲突"解决"掉，
          # 而且 git merge 一旦成功就落了 commit，后面再合同一个 tag 只会得到 "Already up to date" → 冲突数永远是 0，
          # 这条闸门就成了"自动发坏包"的绿灯。--no-commit 什么都不提交，merge --abort 能干净退回 BASE。
          rc=0
          git merge --no-edit --no-commit "$NEW" >/tmp/strict.out 2>&1 || rc=$?
          git diff --name-only --diff-filter=U > "$CONFLICTS_FILE"
          CONFLICTS=$(grep -c . "$CONFLICTS_FILE" || true)
          echo "--- 合并输出（末 15 行，rc=$rc）---"
          tail -15 /tmp/strict.out 2>/dev/null || true
          echo "冲突文件数 = $CONFLICTS"
          sed 's/^/  U /' "$CONFLICTS_FILE" || true
          # 零冲突才有意义去试补丁：有冲突时树里带 <<<<<<< 标记，补丁的上下文当然对不上，那种"红"什么也没说。
          PATCH=skipped
          if [ "$CONFLICTS" = "0" ]; then
            patchrc=0
            node "$CLIENT/tools/check-patch-applies.mjs" --game "$GAME" --out "$PATCH_OUT" || patchrc=$?
            if [ "$patchrc" = "0" ]; then
              PATCH=ok
            else
              PATCH=fail
              echo "（补丁检查 rc=$patchrc —— 自动出包正是会在这里红）"
            fi
          fi
          git merge --abort 2>/dev/null || true
          # 阳性对照：这一跑必须真的"试过合并"，而且把树还原干净 —— 否则后面的挂载点对照量的就是合并后的树，
          # 那个数会凭空变小。核 HEAD、核工作树，两个都对了才承认上面的数字。
          NOW=$(git rev-parse HEAD)
          if [ "$NOW" != "$BASE" ]; then
            echo "merge --abort 没退回原位（$BASE → $NOW），强制 reset 回 checkout 的那个 commit"
            git reset --hard "$BASE"
          fi
          test -z "$(git status --porcelain)" || { echo "合并探针之后工作树不干净，后面的数字不作数"; exit 1; }
          echo "conflicts=$CONFLICTS" >> "$GITHUB_OUTPUT"
          echo "patch=$PATCH" >> "$GITHUB_OUTPUT"

      - name: 与我们的挂载点清单对照
        if: steps.up.outputs.up_to_date == 'no'
        working-directory: game
        env:
          NEWEST: ${{ steps.up.outputs.newest }}
          MERGE_BASE: ${{ steps.up.outputs.base }}
          CONFLICTS: ${{ steps.try.outputs.conflicts }}
          PATCH: ${{ steps.try.outputs.patch }}
          CONFLICTS_FILE: ${{ runner.temp }}/conflicts.txt
          REPORT: ${{ runner.temp }}/auto-sync-report.md
        run: |
          set -euo pipefail
          node - <<'NODE_EOF'
          const { execFileSync } = require('child_process');
          const fs = require('fs');
          const g = (a) => execFileSync('git', a, { encoding: 'utf8' }).trim();
          const doc = JSON.parse(fs.readFileSync('docs/EXT-SURFACE.json', 'utf8'));
          const ours = Object.keys(doc.files);
          const BASE = process.env.MERGE_BASE;
          if (!BASE) { console.error('没有 merge base，这一跑没有基线，数字都不作数'); process.exit(2); }
          // 基线必须是共同祖先，不能是 HEAD：HEAD 里含我们自己的 586 行挂载改动（记在 36 个上游文件上），拿它当基线会把我们的差异
          // 也算成"上游动了"（实测那样报 37/37，按 merge base 是 203 个文件里 18 个）。
          const touched = new Set(g(['diff', '--name-only', `${BASE}..upstream/master`]).split('\n').filter(Boolean));
          const hit = ours.filter((f) => touched.has(f));
          const behind = g(['rev-list', '--count', `${BASE}..upstream/master`]);
          const conflicts = (process.env.CONFLICTS || '').trim();
          const conflicted = fs.existsSync(process.env.CONFLICTS_FILE)
            ? fs.readFileSync(process.env.CONFLICTS_FILE, 'utf8').split('\n').map((s) => s.trim()).filter(Boolean)
            : [];
          const patch = process.env.PATCH || 'skipped';
          console.log(`上游自共同祖先起 ${behind} 个提交 / ${touched.size} 个文件；其中 ${hit.length}/${ours.length} 个是我们压了挂载点的上游文件：`);
          console.log(hit.map((f) => `  · ${f}`).join('\n') || '  （没有）');
          console.log(`严格合并冲突 ${conflicts} 个：${conflicted.join(' / ') || '（无）'}`);
          console.log(`patches/game-client.patch（3 个文件）在合并结果上：${patch}`);
          const ready = conflicts === '0' && patch === 'ok';
          const verdict = ready
            ? `这一刀合得干净、补丁也打得上${hit.length ? `；上游虽然动了 ${hit.length} 个挂载点文件，但都没冲突 —— 自动出包的条件成立，代价由后面的套件与 payload 闸门去判` : ' —— 自动出包+自动发布的条件成立。'}`
            : `这一刀还要人处理：冲突 ${conflicts} 个 / 压着挂载点 ${hit.length} 个 / 补丁 ${patch}。地基没好之前不要把 schedule 升到"合干净就发"。`;
          console.log(`结论：${verdict}`);
          fs.writeFileSync(process.env.REPORT, [
            '# auto-sync 报告',
            '',
            `- 游戏 fork：${process.env.GAME_REPO}，分支：${process.env.BASE_REF}`,
            `- 上游：${process.env.UPSTREAM_REPO}，最新 tag：${process.env.NEWEST}`,
            `- 共同祖先（基线）：${BASE}`,
            `- 上游自基线起：**${behind} 个提交 / ${touched.size} 个文件**`,
            `- 严格合并（不替人解决冲突）的冲突文件数：**${conflicts}**`,
            ...(conflicted.length ? conflicted.map((f) => `  - 冲突：${f}`) : []),
            `- patches/game-client.patch 在合并结果上：**${patch}**`,
            `- 压着我们挂载点的上游文件：**${hit.length}/${ours.length}**`,
            '',
            hit.map((f) => `- ${f}`).join('\n'),
            '',
            verdict,
            '',
          ].join('\n'));
          NODE_EOF
          echo '--- 报告全文 ---'; cat "$REPORT"

      - name: 合并干净且补丁打得上时才推 auto/ 分支（report 模式不推）
        if: |
          steps.up.outputs.up_to_date == 'no' && env.MODE == 'branch'
          && steps.try.outputs.conflicts == '0' && steps.try.outputs.patch == 'ok'
        working-directory: game
        run: |
          set -euo pipefail
          # 走到这里 = 上游这一刀零冲突，且我们的补丁在合并结果上打得上。仍然只推到 auto/upstream-sync-<tag>：
          # feat/skins 可能是别人正在用的分支，这条 lane 不往里面写任何东西。
          NEW="${{ steps.up.outputs.newest }}"
          BR="auto/upstream-sync-${NEW}"
          if git ls-remote --exit-code --heads origin "$BR" >/dev/null 2>&1; then
            echo "$BR 已存在（里面可能有人工修改）—— 不覆盖，停在这里等人看"
            exit 1
          fi
          git merge --no-edit "$NEW"
          git push origin "HEAD:refs/heads/$BR"
          # 别只信 push 的退出码：核对远端真的有这个 ref、且 sha 对得上。
          REMOTE=$(git ls-remote origin "refs/heads/$BR" | cut -f1)
          LOCAL=$(git rev-parse HEAD)
          echo "local =$LOCAL"
          echo "remote=$REMOTE"
          test "$REMOTE" = "$LOCAL" || { echo "推完在远端没看到 $BR（或 sha 不一致）"; exit 1; }
          echo "✓ 推了 $BR —— 下一步：用 test-game-branch 跑它，再 cut-payload --game_ref $BR"

      # ---------------------------------------------------------------------------------------------------------------
      # auto 模式：把手从"上游发版 → 服务端上线"这一段里撤出来。
      #
      # 门槛是四道，缺一道就什么都不推 —— 这一条 lane 推的是**服务端上线分支**，推完几分钟就有 300 多个玩家
      # 在用，所以这里的每一行都比"想省事"重要：
      #   1) 严格合并零冲突（report 那一跑已经量过一遍，这里对 LIVE_REF 再量一遍：两条树的冲突不是同一个数）
      #   2) patches/game-client.patch 在合并结果上打得上（这是自动出包真正会红的那一处）
      #   3) 游戏仓完整 npm test 绿 —— 照抄 test-game-branch.yml 的那套：补素材 → 补增量素材 → npm test
      #   4) 仓库变量 AUTO_SYNC_LIVE=on（止损开关：出错时不用改 YAML，改一个变量就停）
      # 前三道里任何一道不过 → 落成 issue 等人。日常那种"上游加了点东西"的版本会自动走完，人要处理的只剩真冲突。
      # ---------------------------------------------------------------------------------------------------------------
      - name: 'auto：合进服务端上线分支 → 跑完整游戏套件 → 绿了才推'
        if: |
          steps.up.outputs.up_to_date == 'no' && env.MODE == 'auto'
          && steps.try.outputs.conflicts == '0' && steps.try.outputs.patch == 'ok'
        id: auto
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW: ${{ steps.up.outputs.newest }}
          LIVE: ${{ env.LIVE_REF }}
          AUTO_SYNC_LIVE: ${{ env.AUTO_SYNC_LIVE }}
          GAME: ${{ github.workspace }}/game
        run: |
          set -euo pipefail
          cd "$GAME"
          git config user.name 'auto-sync (auto)'; git config user.email 'auto-sync@invalid'
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null || true
          git fetch -q --tags upstream
          git fetch -q origin "$LIVE"
          git checkout -B "$LIVE" "origin/$LIVE"
          echo "服务端上线分支 $LIVE 现在是 $(git rev-parse --short HEAD)"

          PREV_ONLINE=$(git rev-parse HEAD)
          echo "PREV_HEAD=$PREV_ONLINE" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$NEW" HEAD; then
            echo "$LIVE 已经包含上游 $NEW —— 这一跑无事可做"
            echo "outcome=already" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 又严一遍：被测的树（BASE_REF）和要推的树（LIVE_REF）不是同一棵，冲突数必须在这一棵上重算。
          rc=0
          git merge --no-edit --no-commit "$NEW" >/tmp/auto-merge.out 2>&1 || rc=$?
          U=$(git diff --name-only --diff-filter=U | grep -c . || true)
          if [ "$U" != "0" ]; then
            git merge --abort 2>/dev/null || true
            echo "合进 $LIVE 时出现 $U 个冲突 —— 什么都不推"
            git diff --name-only --diff-filter=U | sed 's/^/  U /'
            echo "outcome=conflict" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          git commit -m "auto-sync: merge upstream ${NEW}（零冲突，自动化 lane）" >/dev/null
          echo "✓ 合进 $LIVE：$(git rev-parse --short HEAD)"

          # ---- 跑完整游戏套件（同 test-game-branch.yml：素材 → 增量素材 → npm test） ----
          REL="${PAYLOAD_RELEASE}"
          if [ -z "$REL" ]; then
            REL=$(gh release list -R lilyco-42/StrongholdProtocolClient --limit 30 --json tagName \
                  --jq '.[]|select(.tagName|startswith("payload-"))|.tagName' | head -1)
          fi
          test -n "$REL" || { echo "找不到 payload-* Release，套件没法跑（素材在 git 外面）"; echo "outcome=no-payload" >> "$GITHUB_OUTPUT"; exit 1; }
          echo "素材来源：$REL"
          mkdir -p "$RUNNER_TEMP/payload"
          # 只取**完整 payload**：同一个 Release 里从 c46 起还有 sp-client-code-*.tar.gz（11 MB 的代码增量），
          # 而 `-p '*.tar.gz'` 会把它也下下来，`ls | head -1` 又按字母序先拿到 code-* —— 于是"素材"其实是个
          # 只有 js/css 的增量包，后面 public/assets 直接不存在（2026-10-18 实测就是这样红的）。
          # cut-payload.yml 早就用了这个更窄的 pattern，这条 lane 漏了同样的教训。
          gh release download "$REL" -R lilyco-42/StrongholdProtocolClient -D "$RUNNER_TEMP/payload" -p 'sp-client-payload-*.tar.gz'
          tar=$(ls "$RUNNER_TEMP/payload"/sp-client-payload-*.tar.gz 2>/dev/null | head -1)
          test -n "$tar" || { echo "$REL 里没有 sp-client-payload-*.tar.gz（只有代码增量？）"; exit 1; }
          mkdir -p "$RUNNER_TEMP/www"
          tar -xzf "$tar" -C "$RUNNER_TEMP/www"
          test -f "$RUNNER_TEMP/www/data/assets.json"
          for d in assets fonts vendor; do
            if [ -d "$RUNNER_TEMP/www/$d" ]; then mkdir -p "public/$d"; cp -a "$RUNNER_TEMP/www/$d/." "public/$d/"; fi
          done
          if [ -f "$RUNNER_TEMP/www/data/local-assets.json" ]; then cp "$RUNNER_TEMP/www/data/local-assets.json" data/local-assets.json; fi
          A=$(find public/assets -type f | wc -l); V=$(find public/vendor -type f | wc -l)
          echo "素材 assets=$A vendor=$V"
          test "$A" -gt 10000 || { echo "素材没拷够 —— 跑出来的套件不去信"; echo "outcome=bad-art" >> "$GITHUB_OUTPUT"; exit 1; }

          npm install --ignore-scripts --no-audit --no-fund
          # ext-surface 那条 "no unrecorded mount points" 要 upstream/master 这个 ref，没有它是直接抛的
          # （它不是红在合并上，而是红在环境上 —— 5782 项里那唯一一条就是它）。
          git fetch --no-tags --depth 1 upstream master
          git update-ref refs/remotes/upstream/master FETCH_HEAD
          node tools/fetch-assets.mjs 2>&1 | tail -10 || echo "（fetch-assets 失败：让下面的套件去判，别在这里掩盖）"

          rc2=0
          npm test > "$RUNNER_TEMP/npm-test.log" 2>&1 || rc2=$?
          echo "npm test 退出码 = $rc2"
          grep -E "^# (tests|pass|fail|cancelled|skipped|todo) " "$RUNNER_TEMP/npm-test.log" || true
          echo "--- 失败的用例 ---"
          grep -nE "^ *not ok [0-9]+ - " "$RUNNER_TEMP/npm-test.log" | head -40 || true
          if [ "$rc2" != "0" ]; then
            echo "游戏套件红（$rc2）—— 一个字节都不推"
            echo "outcome=tests-red" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # ---- 三道都过了：AUTO_SYNC_LIVE 决定推不推 ----
          if [ "${AUTO_SYNC_LIVE}" != "on" ]; then
            echo "✓ 合并 + 套件全绿，但 AUTO_SYNC_LIVE=${AUTO_SYNC_LIVE}（默认 off）—— 什么都没推。"
            echo "  想让它真自动上线：Settings → Variables 里加 AUTO_SYNC_LIVE=on。"
            echo "  要这一刀：进 game/ 手动合 $(git rev-parse --short HEAD)，或把 AUTO_SYNC_LIVE 设成 on 重跑本 lane。"
            echo "outcome=gated" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push origin "HEAD:refs/heads/$LIVE"
          REMOTE=$(git ls-remote origin "refs/heads/$LIVE" | cut -f1)
          LOCAL=$(git rev-parse HEAD)
          test "$REMOTE" = "$LOCAL" || { echo "推完远端没看到 $LOCAL（$REMOTE）—— 别当成成功"; echo "outcome=push-unverified" >> "$GITHUB_OUTPUT"; exit 1; }
          echo "outcome=pushed" >> "$GITHUB_OUTPUT"
          echo "✓ 已推 $LIVE @ $LOCAL —— 服务端的 deploy hook/timer 会在几分钟内把这一刀上线"
          echo "  回滚：git fetch origin && git reset --hard $PREV_ONLINE && git push --force-with-lease origin HEAD:refs/heads/$LIVE"

      # 两种"要人"的情况：① 上面那一步自己败了（冲突/套件红/缺素材）；② 连试都没资格试 ——
      # 量代价那一步就已经报了冲突或补丁打不上。第二种最容易变成"没人看见的红灯"：lane 是绿的，
      # 报告躺在 artifact 里，而服务端一直停在老版本上。所以这里两条都要叫人。
      - name: 需要人处理时落成 issue
        if: |
          (failure() && steps.auto.outputs.outcome != '')
          || (env.MODE == 'auto' && steps.up.outputs.up_to_date == 'no'
              && (steps.try.outputs.conflicts != '0' || steps.try.outputs.patch != 'ok'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ steps.auto.outputs.outcome }}
          CONFLICTS: ${{ steps.try.outputs.conflicts }}
          PATCH: ${{ steps.try.outputs.patch }}
          NEWEST: ${{ steps.up.outputs.newest }}
          LIVE: ${{ env.LIVE_REF }}
          PREV: ${{ steps.auto.outputs.PREV_HEAD }}
          REPORT: ${{ runner.temp }}/auto-sync-report.md
        run: |
          set -euo pipefail
          WHY="${OUTCOME:-量代价那一步就没过（冲突 ${CONFLICTS:-?} / 补丁 ${PATCH:-?}）}"
          TITLE="auto-sync 需要人：上游 ${NEWEST} 没能自动合进 ${LIVE}"
          BODY="自动 lane 停在：\`${WHY}\`。**没有推任何东西**，服务端仍在线上原来那一刀。

          - 上游那一刀：\`${NEWEST}\`
          - 目标分支：\`${LIVE}\`（回滚基线 \`${PREV:-（未知）}\`）
          - 流水线：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          怎么办：本地进入游戏仓 → \`git fetch --tags upstream && git merge <那一刀>\` → 手工解冲突 →
          游戏仓 \`npm test\` 绿了 → 推 \`${LIVE}\`。辅助材料见本 run 的 \`auto-sync-report\`。"
          EXISTING=$(gh issue list -R "${{ github.repository }}" --label auto-sync --state open --limit 1 --json number --jq '.[0].number // ""')
          if [ -n "$EXISTING" ]; then
            gh issue comment -R "${{ github.repository }}" "$EXISTING" --body "$BODY"
            echo "已追加到既有 issue #$EXISTING"
          else
            gh label create auto-sync --force -R "${{ github.repository }}" >/dev/null
            gh issue create -R "${{ github.repository }}" --title "$TITLE" --label auto-sync --body "$BODY"
          fi

      - name: 存档报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-sync-report
          path: ${{ runner.temp }}/auto-sync-report.md
          if-no-files-found: warn
          retention-days: 60
