name: build-ours

# 我们的安卓包 — 拼装模式:
#   素材 = 本仓库 release 的四个资源包(essential/fx/voice/skin, 在 PC 上, 不占服务器带宽)
#   代码 = 同一 release 的 sp-code.tar.gz(服务器上生成, 仅 7MB)
#   CI 解开两者拼成 payload → 校验(只连本站/无选择器/素材量) → 打 APK → 签名 → artifact

on:
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  RELEASE_BASE: https://github.com/Qu1n-22/StrongholdProtocolClient/releases/download/payload

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 准备固定签名钥匙（release）
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "${KS_B64:-}" ] || { echo "缺 secret ANDROID_KEYSTORE_BASE64"; exit 1; }
          [ -n "${KS_PASS:-}" ] || { echo "缺 secret ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          mkdir -p mobile/android/keystore
          printf '%s' "$KS_B64" | base64 -d > mobile/android/keystore/upload-keystore.p12
          echo "storeFile=keystore/upload-keystore.p12" > mobile/android/keystore.properties
          echo "storePassword=$KS_PASS" >> mobile/android/keystore.properties
          echo "keyAlias=stronghold" >> mobile/android/keystore.properties
          echo "keyPassword=$KS_PASS" >> mobile/android/keystore.properties
          keytool -list -keystore mobile/android/keystore/upload-keystore.p12 -storepass "$KS_PASS" -alias stronghold > /dev/null
          echo "keystore 可解"

      - name: 安装 Android SDK 组件
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | sort | tail -1)
          test -n "$SDKMANAGER" || { echo "找不到 sdkmanager"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: 下载素材（代码包 + 四资源包）
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 3 "$RELEASE_BASE/sp-code.tar.gz" -o sp-code.tar.gz
          for P in essential fx voice skin; do
            curl -fL --retry 3 --retry-delay 3 "$RELEASE_BASE/stronghold-resources-$P-475a5205a217.zip" -o "$P.zip"
          done
          ls -lh sp-code.tar.gz *.zip

      - name: 拼装 payload
        run: |
          set -euo pipefail
          mkdir -p build/client/www
          tar -xzf sp-code.tar.gz -C build/client
          python3 tools/unpack_packs.py essential.zip fx.zip voice.zip skin.zip --out build/client/www
          echo "payload 文件数: $(find build/client/www -type f | wc -l)"

      - name: 校验 payload（完整性 + 服务器锁定）
        run: |
          set -euo pipefail
          for f in index.html js/runtime-config.js js/net.js; do
            test -f "build/client/www/$f" || { echo "缺 $f"; exit 1; }
          done
          if [ -f build/client/www/js/shell/picker.js ]; then echo "payload 含选择器, 拒绝构建"; exit 1; fi
          echo "OK: 无服务器选择器"
          ASSETS=$(find build/client/www/assets -type f 2>/dev/null | wc -l)
          echo "素材文件数: $ASSETS"
          test "$ASSETS" -gt 20000 || { echo "素材不完整"; exit 1; }
          echo "--- runtime-config.js ---"; cat build/client/www/js/runtime-config.js
          grep -q "101.43.97.133" build/client/www/js/runtime-config.js || { echo "服务器地址不对"; exit 1; }
          cat build/client/www/build.json

      - name: 构建 APK
        run: |
          set -euo pipefail
          cd mobile
          npm ci --no-audit --no-fund
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: stronghold-ours-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 14
