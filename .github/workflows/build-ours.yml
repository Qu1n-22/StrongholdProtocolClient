name: build-ours

# 我们的安卓包 — 服务器直供模式:
#   payload = 服务器上生成的完整包(代码+素材+本站地址), CI 构建时从服务器拉取
#   构建时段选 0 人在线时(占用服务器带宽约 1 小时)
#   校验闸门: 只连本站/无选择器/素材量 → 打 APK → 签名 → artifact

on:
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 准备固定签名钥匙（release）
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "${KS_B64:-}" ] || { echo "缺 secret ANDROID_KEYSTORE_BASE64"; exit 1; }
          [ -n "${KS_PASS:-}" ] || { echo "缺 secret ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          mkdir -p mobile/android/keystore
          printf '%s' "$KS_B64" | base64 -d > mobile/android/keystore/upload-keystore.p12
          echo "storeFile=keystore/upload-keystore.p12" > mobile/android/keystore.properties
          echo "storePassword=$KS_PASS" >> mobile/android/keystore.properties
          echo "keyAlias=stronghold" >> mobile/android/keystore.properties
          echo "keyPassword=$KS_PASS" >> mobile/android/keystore.properties
          keytool -list -keystore mobile/android/keystore/upload-keystore.p12 -storepass "$KS_PASS" -alias stronghold > /dev/null
          echo "keystore 可解"

      - name: 安装 Android SDK 组件
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | sort | tail -1)
          test -n "$SDKMANAGER" || { echo "找不到 sdkmanager"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: 下载并解压 payload（服务器直供）
        run: |
          set -euo pipefail
          URL="https://101.43.97.133/download/sp-payload.tar.gz"
          echo "payload: $URL"
          mkdir -p build/client/www
          curl -fL --retry 5 --retry-delay 5 -C - "$URL" -o payload.tar.gz
          ls -lh payload.tar.gz
          tar -xzf payload.tar.gz -C build/client
          echo "payload 文件数: $(find build/client/www -type f | wc -l)"

      - name: 校验 payload（完整性 + 服务器锁定）
        run: |
          set -euo pipefail
          for f in index.html js/runtime-config.js js/net.js; do
            test -f "build/client/www/$f" || { echo "缺 $f"; exit 1; }
          done
          if [ -f build/client/www/js/shell/picker.js ]; then echo "payload 含选择器, 拒绝构建"; exit 1; fi
          echo "OK: 无服务器选择器"
          ASSETS=$(find build/client/www/assets -type f 2>/dev/null | wc -l)
          echo "素材文件数: $ASSETS"
          test "$ASSETS" -gt 20000 || { echo "素材不完整"; exit 1; }
          echo "--- runtime-config.js ---"; cat build/client/www/js/runtime-config.js
          grep -q "101.43.97.133" build/client/www/js/runtime-config.js || { echo "服务器地址不对"; exit 1; }
          cat build/client/www/build.json

      - name: 构建 APK
        run: |
          set -euo pipefail
          cd mobile
          npm ci --no-audit --no-fund
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: stronghold-ours-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 14
